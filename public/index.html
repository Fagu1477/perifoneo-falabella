<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audio Local</title><link rel="stylesheet" href="styles.css"></head><body><main class="card"><h1>🔊 Audio Local</h1><p class="sub">Control remoto de las bocinas</p><div id="status" class="status">Conectando…</div><section id="audio-list" aria-label="Anuncios disponibles"></section><button id="stop" class="stop">⏹ DETENER AUDIO</button><button id="admin-toggle" class="admin-toggle" type="button">⚙️ Administrar anuncios</button><section id="admin-panel" class="admin-panel" hidden><h2>Administración</h2><form id="login-form"><label for="admin-password">Contraseña de administrador</label><input id="admin-password" name="password" type="password" autocomplete="current-password" required><button class="admin-action" type="submit">Iniciar sesión</button></form><form id="upload-form" hidden><label for="audio-title">Nombre del anuncio</label><input id="audio-title" name="title" type="text" maxlength="80" placeholder="Ej. promoción verano" required><label for="audio-file">Archivo MP3 (máximo 50 MB)</label><input id="audio-file" name="audio" type="file" accept=".mp3,audio/mpeg" required><button class="admin-action" type="submit">⬆️ Subir anuncio</button></form><section id="record-controls" class="record-controls" hidden><label for="recording-title">Nombre de la grabación</label><input id="recording-title" type="text" maxlength="80" placeholder="Ej. anuncio de la mañana"><button id="record-audio" class="record-action" type="button">🎙️ Grabar voz</button><p class="record-note">Necesitas permitir el acceso al micrófono. En internet, abre la página con HTTPS.</p></section><button id="admin-logout" class="admin-logout" type="button" hidden>Cerrar sesión</button><p id="admin-message" class="admin-message" role="status" aria-live="polite"></p></section><p class="note">El audio se reproduce en el PC que tenga abierta la pantalla /player.html.</p></main><script src="/socket.io/socket.io.js"></script><script src="script.js"></script></body></html>
